name: Package release candidates

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Leave empty to build release candidates only. Type "publish" to publish to npm.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:cli
      - run: npm run build -w @assurly/mcp-server
      - run: npm run build:action
      - run: npm pack -w packages/scanner-core -w packages/cli -w packages/mcp-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurly-release-candidates
          path: |
            assurly-*.tgz
            packages/github-action/action.yml
            packages/github-action/dist/index.js
          if-no-files-found: error

  publish:
    if: github.event.inputs.confirm == 'publish'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` was only needed to sign provenance attestations. Publishing
      # no longer does that, so the OIDC token is dropped — least privilege.
      contents: read
    steps:
      - name: Require explicit publish confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Refusing to publish: workflow input confirm must be exactly publish."
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run build:cli
      - run: npm run build -w @assurly/mcp-server
      # Published WITHOUT --provenance on purpose. npm can only resolve a provenance
      # attestation when the source repository is public; this one is private, so npm
      # rendered "Unable to find the source commit for this package… verify the source
      # before using this package" on every published version (1.0.0–1.0.2). An
      # attestation nobody can verify is worse than none: it makes a claim and then
      # shows a warning that erodes trust in a security product.
      #
      # To bring provenance back, publish these packages from a PUBLIC repository —
      # splitting the CLI/scanner/MCP packages out of the private SaaS repo. Then the
      # attestation resolves and actually means something to the people installing it.
      - name: Publish scanner-core, CLI, and MCP server (dependency order)
        run: |
          npm publish -w packages/scanner-core
          npm publish -w packages/cli
          npm publish -w packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# Release candidates (package job) and npm publish (publish job) are intentionally separate operations.
# The publish job runs only when a human dispatches this workflow with confirm set to "publish".
# Prerequisites before the first publish:
# - Create the @assurly npm org and configure 2FA on the publishing account.
# - Add NPM_TOKEN (Automation token with publish access) to repository secrets.
# - Keep each package repository.url pointing at this GitHub repository.
# - Choose and tag the first public version (currently 1.0.0 in all three packages).
# Publish order: scanner-core → cli → mcp-server (mcp-server depends on exact published versions).
# Other release surfaces remain separate authorized operations: a signed GitHub release/tag for the Action
# Marketplace, and vsce publish with a VS Marketplace token.
